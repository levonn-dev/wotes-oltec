# go-task taskfile (https://taskfile.dev). `task` with no args lists every task; Task wraps CMake.
# The presets do the configuring, one build tree per base ROM; bootstrap fetches tools/, check:host is the CI gate.

version: "3"

vars:
  # One build tree per base ROM, each under build/ by its preset's name.
  PRESETS: m68k m68k-chili-v1 m68k-chili-v2

tasks:

  default:
    desc: List available tasks (run with no args)
    silent: true
    cmds:
      - task --list

  # ------------------------------ bootstrap ------------------------------

  bootstrap:
    desc: Install BlastEm, mdrom and planetchili's two patches into tools/, build wotes-tiled there; check the apt tools and the clean ROM
    cmds:
      - scripts/bootstrap.sh

  # -------------------------------- build --------------------------------

  configure:
    desc: 'Configure the three build trees, build/m68k, build/m68k-chili-v1 and build/m68k-chili-v2 (extra CMake options after -- go to each, e.g. task configure -- -DCLEAN_ROM=path)'
    status:
      - '{{if .CLI_ARGS}}false{{else}}{{range $p := splitList " " .PRESETS}}test -f build/{{$p}}/build.ninja && {{end}}true{{end}}'
    cmds:
      - for: { var: PRESETS }
        cmd: cmake --preset {{.ITEM}} {{.CLI_ARGS}}

  build:
    desc: 'Build the patch for each base: link, 68000 scan, hook check, inject, then oltec.bps, oltec-chili-v1.bps and oltec-chili-v2.bps'
    cmds:
      - task: configure
      - for: { var: PRESETS }
        cmd: cmake --build --preset {{.ITEM}}

  run:
    desc: 'Run the patched ROM in BlastEm (no debugger); BASE=chili-v1 or BASE=chili-v2 runs that build'
    vars:
      BASE: '{{.BASE | default "clean"}}'
      PRESET: '{{if eq .BASE "clean"}}m68k{{else}}m68k-{{.BASE}}{{end}}'
    preconditions:
      - sh: 'case " {{.PRESETS}} " in *" {{.PRESET}} "*) ;; *) exit 1 ;; esac'
        msg: 'BASE={{.BASE}} has no build tree; use clean, chili-v1 or chili-v2'
    cmds:
      - task: build
      - cmake --build --preset {{.PRESET}} --target run

  # -------------------------------- check --------------------------------

  check:
    desc: 'Full check: build, the wotes-tiled round trip against the clean ROM, then the on-target GDB check on each of the three ROMs'
    cmds:
      - task: build
      - task: tiled:roundtrip
      - task: check:target

  check:host:
    desc: 'Host-only checks, no cross compiler or ROM needed: wotes-tiled tests, shellcheck. The CI gate.'
    cmds:
      - task: tiled:test
      - shellcheck scripts/*.sh

  check:target:
    desc: Boot each of the three patched ROMs under GDB and check the palette fade_in_hook sees on the intro's first fade
    cmds:
      - for: { var: PRESETS }
        cmd: cmake --build --preset {{.ITEM}} --target check-target

  # -------------------------------- tiled --------------------------------

  tiled:build:
    desc: Build wotes-tiled into tools/wotes-tiled
    dir: wotes-tiled
    cmds:
      - go build -o ../tools/wotes-tiled/wotes-tiled .

  tiled:test:
    desc: Vet and test wotes-tiled without the ROM
    dir: wotes-tiled
    cmds:
      - gofmt -l . | { ! grep .; }
      - go vet ./...
      - go test ./...

  tiled:roundtrip:
    desc: Round-trip every ROM region, read every dungeon level and VIEW MAP picture and check two extracts match (needs the configured build tree)
    dir: wotes-tiled
    env:
      WOTES_CLEAN_ROM: '{{.ROOT_DIR}}/build/m68k/base.md'
    cmds:
      - task: configure
      - go test -run 'TestRoundTrip|TestDungeonsReal|TestRunIsDeterministicReal|TestSpeechRoundTripReal|TestCityFiguresReal|TestAreaPictureReal' ./internal/convert/ ./internal/rom/ ./internal/extract/ ./internal/dungeon/

  tiled:extract:
    desc: Extract every outdoor tile set and map and every dungeon level of the clean ROM into maps/rom
    cmds:
      - task: configure
      - task: tiled:build
      - tools/wotes-tiled/wotes-tiled extract --rom build/m68k/base.md --out maps

  tiled:render:
    desc: 'Render a map or a ROM region to PNG, e.g. task tiled:render -- --region valley --out build/valley.png'
    cmds:
      # configure would otherwise receive the render arguments as CMake options.
      - task: configure
        vars: {CLI_ARGS: ''}
      - task: tiled:build
      - tools/wotes-tiled/wotes-tiled render {{.CLI_ARGS}} --rom build/m68k/base.md

  tiled:install:
    desc: Fetch the pinned Tiled AppImage into tools/tiled (optional; the build never needs it)
    cmds:
      - scripts/install-tiled.sh

  tiled:
    desc: 'Open the Tiled project, or a map, in the Tiled installed in tools/tiled (task tiled -- maps/rom/valley.tmj)'
    preconditions:
      - sh: test -x tools/tiled/squashfs-root/AppRun
        msg: run task tiled:install first
    cmds:
      - tools/tiled/squashfs-root/AppRun {{.CLI_ARGS | default "maps/wotes.tiled-project"}}

  # -------------------------------- debug --------------------------------

  debug:
    desc: 'Interactive gdb-multiarch session against BlastEm, paused at the reset vector; BASE as for run'
    interactive: true
    vars:
      BASE: '{{.BASE | default "clean"}}'
      PRESET: '{{if eq .BASE "clean"}}m68k{{else}}m68k-{{.BASE}}{{end}}'
      # The image names IMAGE_NAME gives each base in CMakeLists.txt.
      IMAGE: '{{if eq .BASE "clean"}}patched{{else}}patched-{{.BASE}}{{end}}'
    preconditions:
      - sh: 'case " {{.PRESETS}} " in *" {{.PRESET}} "*) ;; *) exit 1 ;; esac'
        msg: 'BASE={{.BASE}} has no build tree; use clean, chili-v1 or chili-v2'
    cmds:
      - task: build
      - scripts/gdb.sh build/{{.PRESET}}/patch.elf -ex 'set architecture m68k' -ex 'target remote | scripts/blastem.sh build/{{.PRESET}}/{{.IMAGE}}.md -D'

  # -------------------------------- clean --------------------------------

  clean:
    desc: Remove build/ and the Task cache (tools/ stays; delete it to bootstrap again)
    cmds:
      - rm -rf build .task
