# go-task taskfile (https://taskfile.dev). `task` with no args lists every task; Task wraps CMake.
# The m68k preset does the configuring, bootstrap fetches tools/, check:host is the CI gate.

version: "3"

tasks:

  default:
    desc: List available tasks (run with no args)
    silent: true
    cmds:
      - task --list

  # ------------------------------ bootstrap ------------------------------

  bootstrap:
    desc: Install BlastEm and mdrom into tools/, build wotes-tiled there; check the apt tools and the clean ROM
    cmds:
      - scripts/bootstrap.sh

  # -------------------------------- build --------------------------------

  configure:
    desc: 'Configure build/m68k with the m68k preset (extra CMake options after --, e.g. task configure -- -DCLEAN_ROM=path)'
    status:
      - '{{if .CLI_ARGS}}false{{else}}test -f build/m68k/build.ninja{{end}}'
    cmds:
      - cmake --preset m68k {{.CLI_ARGS}}

  build:
    desc: 'Build everything: link, 68000 scan, hook check, inject, patch.bps, host helper test'
    cmds:
      - task: configure
      - cmake --build --preset m68k

  run:
    desc: Run the patched ROM in BlastEm (no debugger)
    cmds:
      - task: build
      - cmake --build --preset m68k --target run

  # -------------------------------- check --------------------------------

  check:
    desc: 'Full check: build, the wotes-tiled round trip against the clean ROM, then the on-target GDB check of poc_init'
    cmds:
      - task: build
      - task: tiled:roundtrip
      - task: check:target

  check:host:
    desc: 'Host-only checks, no cross compiler or ROM needed: helper test, wotes-tiled tests, shellcheck. The CI gate.'
    cmds:
      - scripts/check-rt.sh build/host
      - task: tiled:test
      - shellcheck scripts/*.sh

  check:target:
    desc: Boot the patched ROM under GDB and check the value poc_init returns
    cmds:
      - cmake --build --preset m68k --target check-target

  # -------------------------------- tiled --------------------------------

  tiled:build:
    desc: Build wotes-tiled into tools/wotes-tiled
    dir: wotes-tiled
    cmds:
      - go build -o ../tools/wotes-tiled/wotes-tiled .

  tiled:test:
    desc: Vet and test wotes-tiled without the ROM
    dir: wotes-tiled
    cmds:
      - gofmt -l . | { ! grep .; }
      - go vet ./...
      - go test ./...

  tiled:roundtrip:
    desc: Round-trip every ROM region, read every dungeon level and VIEW MAP picture and check two extracts match (needs the configured build tree)
    dir: wotes-tiled
    env:
      WOTES_CLEAN_ROM: '{{.ROOT_DIR}}/build/m68k/clean.md'
    cmds:
      - task: configure
      - go test -run 'TestRoundTrip|TestDungeonsReal|TestRunIsDeterministicReal|TestSpeechRoundTripReal|TestCityFiguresReal|TestAreaPictureReal' ./internal/convert/ ./internal/rom/ ./internal/extract/ ./internal/dungeon/

  tiled:extract:
    desc: Extract every outdoor tile set and map and every dungeon level of the clean ROM into maps/rom
    cmds:
      - task: configure
      - task: tiled:build
      - tools/wotes-tiled/wotes-tiled extract --rom build/m68k/clean.md --out maps

  tiled:render:
    desc: 'Render a map or a ROM region to PNG, e.g. task tiled:render -- --region valley --out build/valley.png'
    cmds:
      # configure would otherwise receive the render arguments as CMake options.
      - task: configure
        vars: {CLI_ARGS: ''}
      - task: tiled:build
      - tools/wotes-tiled/wotes-tiled render {{.CLI_ARGS}} --rom build/m68k/clean.md

  tiled:install:
    desc: Fetch the pinned Tiled AppImage into tools/tiled (optional; the build never needs it)
    cmds:
      - scripts/install-tiled.sh

  tiled:
    desc: 'Open the Tiled project, or a map, in the Tiled installed in tools/tiled (task tiled -- maps/rom/valley.tmj)'
    preconditions:
      - sh: test -x tools/tiled/squashfs-root/AppRun
        msg: run task tiled:install first
    cmds:
      - tools/tiled/squashfs-root/AppRun {{.CLI_ARGS | default "maps/wotes.tiled-project"}}

  # -------------------------------- debug --------------------------------

  debug:
    desc: Interactive gdb-multiarch session against BlastEm, paused at the reset vector
    interactive: true
    cmds:
      - task: build
      - scripts/gdb.sh build/m68k/patch.elf -ex 'set architecture m68k' -ex 'target remote | scripts/blastem.sh build/m68k/patched.md -D'

  # -------------------------------- clean --------------------------------

  clean:
    desc: Remove build/ and the Task cache (tools/ stays; delete it to bootstrap again)
    cmds:
      - rm -rf build .task
